<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="张永然的个人博客，记录算法、数学和日常写作。">
    <title>张永然的博客</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="styles.css">
    <script>
      window.MathJax = {
        tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
        svg: { fontCache: "global" }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script defer src="posts.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body>
    <canvas class="ambient" id="ambient" aria-hidden="true"></canvas>

    <header class="site-header">
      <a class="brand" href="#/">
        <span class="brand-mark">Z</span>
        <span>
          <strong>张永然</strong>
          <small>算法 / 数学 / 文章</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="#/">首页</a>
        <a href="#/category/algorithm">算法</a>
        <a href="#/category/math">数学</a>
        <a href="#/category/essay">随笔</a>
      </nav>
    </header>

    <main>
      <section class="intro compact" aria-label="博客概览">
        <aside class="profile-panel" aria-label="博客信息">
          <div>
            <span class="stat-value" id="post-count">0</span>
            <span class="stat-label">篇文章</span>
          </div>
          <div>
            <span class="stat-value">3</span>
            <span class="stat-label">个栏目</span>
          </div>
          <div>
            <span class="stat-value">∞</span>
            <span class="stat-label">持续更新</span>
          </div>
        </aside>
      </section>

      <section class="workspace">
        <aside class="sidebar" aria-label="栏目筛选">
          <div class="section-title">栏目</div>
          <div class="category-list" id="category-list"></div>
        </aside>

        <section class="content-area" id="app" aria-live="polite"></section>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> 张永然</span>
      <span>Built for GitHub Pages</span>
    </footer>
  </body>
</html>
